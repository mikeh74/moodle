name: moodle
services:
  moodle:
    build:
      context: .
      target: development
    image: moodle:dev
    restart: on-failure
    ports:
      - "${DOCKER_APP_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html
      - moodledata:/var/www/moodledata
    env_file:
      - .env
    networks:
      - moodle-network
    depends_on:
      - db
  db:
    image: mysql:8.0
    restart: on-failure
    environment:
      MYSQL_DATABASE: moodle
      MYSQL_USER: moodle
      MYSQL_PASSWORD: moodle
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - moodle-network
volumes:
  db_data:
  moodledata:

networks:
  moodle-network:
    driver: bridge
