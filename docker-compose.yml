services:
  moodle:
    build:
      context: .
      target: production
    image: moodle:4.5.8
    container_name: moodle-dev
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - moodledata:/var/www/moodledata
    env_file:
      - .env
    depends_on:
      - db
  db:
    image: mysql:8.0
    container_name: moodle-db
    restart: always
    environment:
      MYSQL_DATABASE: moodle
      MYSQL_USER: moodle
      MYSQL_PASSWORD: moodle
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
volumes:
  db_data:
  moodledata:
